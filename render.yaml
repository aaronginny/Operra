services:
  - type: web
    name: dealknot
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://dealknot.onrender.com
    disk:
      name: dealknot-db
      mountPath: /data
      sizeGB: 1
